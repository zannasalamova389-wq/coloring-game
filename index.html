<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Раскрась картинку</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    text-align: center;
    min-height: 100vh;
  }
  h1 { color: #333; font-size: 22px; margin: 5px 0 15px; }

  /* ===== Меню выбора картинки ===== */
  .menu {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 700px;
    margin: 0 auto 15px;
  }
  .menu-item {
    background: #fff;
    border-radius: 10px;
    padding: 8px;
    cursor: pointer;
    border: 3px solid transparent;
    transition: 0.2s;
    width: 100px;
  }
  .menu-item:hover { transform: scale(1.05); border-color: #4a90d9; }
  .menu-item img { width: 100%; height: 80px; object-fit: contain; display: block; }
  .menu-item span { font-size: 12px; font-weight: bold; color: #555; display: block; margin-top: 4px; }

  /* ===== Игровой экран ===== */
  .game { display: none; }
  .game.active { display: block; }

  .canvas-wrapper {
    display: inline-block;
    background: #fff;
    border: 2px solid #333;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }
  canvas {
    display: block;
    cursor: crosshair;
    background: #fff;
    touch-action: none;
  }

  /* ===== Панель инструментов ===== */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin: 15px auto 5px;
    max-width: 700px;
    padding: 10px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .toolbar-label {
    font-size: 13px;
    font-weight: bold;
    color: #555;
  }

  /* Размеры кисти */
  .brush-sizes {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .brush-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid #ccc;
    background: #f5f5f5;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.1s;
  }
  .brush-btn:hover { transform: scale(1.1); }
  .brush-btn.active { border-color: #333; background: #e0e0e0; }
  .brush-btn .dot {
    background: #333;
    border-radius: 50%;
    display: block;
  }
  .brush-btn[data-size="4"]  .dot { width: 3px;  height: 3px;  }
  .brush-btn[data-size="10"] .dot { width: 6px;  height: 6px;  }
  .brush-btn[data-size="25"] .dot { width: 14px; height: 14px; }
  .brush-btn[data-size="45"] .dot { width: 22px; height: 22px; }

  /* ===== Палитра ===== */
  .palette {
    margin: 10px auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 700px;
    padding: 10px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .color {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 3px solid #ccc;
    cursor: pointer;
    transition: 0.1s;
  }
  .color:hover { transform: scale(1.1); }
  .color.active { border-color: #333; transform: scale(1.15); }
  .color.eraser {
    border: 3px dashed #999;
    background: #fff !important;
  }

  /* ===== Кнопки ===== */
  .buttons {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  button.main {
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    transition: 0.2s;
  }
  button.main:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
  button.main:active { transform: translateY(0); }
  button.main:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  #backBtn  { background: #4a90d9; }
  #undoBtn  { background: #f5a623; }
  #clearBtn { background: #e74c3c; }
  #saveBtn  { background: #27ae60; }
</style>
</head>
<body>

  <!-- ЭКРАН ВЫБОРА -->
  <div id="menuScreen">
    <h1>🎨 Выбери картинку</h1>
    <div class="menu" id="menu"></div>
  </div>

  <!-- ИГРОВОЙ ЭКРАН -->
  <div class="game" id="game">
    <h1 id="gameTitle">Раскрась картинку</h1>

    <div class="canvas-wrapper">
      <canvas id="canvas" width="600" height="450"></canvas>
    </div>

    <div class="toolbar">
      <span class="toolbar-label">Кисть:</span>
      <div class="brush-sizes" id="brushSizes">
        <div class="brush-btn" data-size="4"  title="Очень тонкая"><span class="dot"></span></div>
        <div class="brush-btn" data-size="10" title="Тонкая"><span class="dot"></span></div>
        <div class="brush-btn active" data-size="25" title="Средняя"><span class="dot"></span></div>
        <div class="brush-btn" data-size="45" title="Толстая"><span class="dot"></span></div>
      </div>
    </div>

    <div class="palette" id="palette"></div>

    <div class="buttons">
      <button class="main" id="backBtn">← Назад</button>
      <button class="main" id="undoBtn">↶ Отменить</button>
      <button class="main" id="clearBtn">🗑 Очистить</button>
      <button class="main" id="saveBtn">💾 Сохранить</button>
    </div>
  </div>

<script>
// ============================================================
// СПИСОК ПЕРСОНАЖЕЙ
// ============================================================
const CHARACTERS = [
  { name: 'Ящерка',    file: 'lizard.png' },
  { name: 'Поросёнок', file: 'pigle.png' },
  { name: 'Барт',      file: 'bart.png' },
  { name: 'Черепашка', file: 'turtle.png' },
  { name: 'Призрак',   file: 'ghost.png' }
];

// ============================================================
// ПАЛИТРА ЦВЕТОВ
// ============================================================
const COLORS = [
  '#FF0000', '#FF4081', '#FF8FB1',
  '#FF6B00', '#FFD700', '#FFF176',
  '#00C853', '#7ED321', '#1B5E20',
  '#00B0FF', '#2962FF', '#0D47A1',
  '#8E24AA', '#BA68C8',
  '#795548', '#D7CCC8',
  '#000000', '#9E9E9E', '#FFFFFF'
];

// ============================================================
// ПЕРЕМЕННЫЕ
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let currentColor = '#FF0000';
let isDrawing = false;
let lastX = 0, lastY = 0;
let brushSize = 25;

// История — массив canvas-снимков (не getImageData!)
let history = [];
const MAX_HISTORY = 30;

let outlineImg = new Image();

// ============================================================
// МЕНЮ
// ============================================================
function buildMenu() {
  const menu = document.getElementById('menu');
  menu.innerHTML = '';

  CHARACTERS.forEach(char => {
    const item = document.createElement('div');
    item.className = 'menu-item';

    const img = document.createElement('img');
    img.src = char.file;
    img.alt = char.name;
    img.onerror = () => { img.style.background = '#eee'; img.alt = 'Нет'; };

    const span = document.createElement('span');
    span.textContent = char.name;

    item.appendChild(img);
    item.appendChild(span);
    item.addEventListener('click', () => startGame(char.file, char.name));
    menu.appendChild(item);
  });
}

function startGame(file, name) {
  console.log('Старт:', file);
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('game').classList.add('active');
  document.getElementById('gameTitle').textContent = 'Раскрась: ' + name;

  history = [];
  updateUndoButton();

  outlineImg = new Image();
  outlineImg.onload = () => {
    redraw();
    updateUndoButton();
    console.log('Картинка загружена:', file);
  };
  outlineImg.onerror = () => {
    console.error('Не найдена картинка:', file);
    alert('Картинка не найдена: ' + file);
  };
  outlineImg.src = file;

  currentColor = '#FF0000';
  brushSize = 25;
  updatePaletteActive();
  updateBrushActive();
}

function showMenu() {
  document.getElementById('game').classList.remove('active');
  document.getElementById('menuScreen').style.display = 'block';
}

// ============================================================
// ПАЛИТРА
// ============================================================
function buildPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';

  COLORS.forEach((color) => {
    const btn = document.createElement('div');
    btn.className = 'color';
    btn.style.background = color;
    btn.dataset.color = color;

    if (color === '#FFFFFF') {
      btn.classList.add('eraser');
      btn.title = 'Ластик';
    }
    if (color === '#FF0000') btn.classList.add('active');

    btn.addEventListener('click', () => {
      document.querySelectorAll('.color').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentColor = color;
      console.log('Цвет:', color);
    });

    palette.appendChild(btn);
  });
}

function updatePaletteActive() {
  document.querySelectorAll('.color').forEach(b => {
    b.classList.toggle('active', b.dataset.color === currentColor);
  });
}

// ============================================================
// РАЗМЕР КИСТИ
// ============================================================
function initBrushSizes() {
  document.querySelectorAll('.brush-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      brushSize = parseInt(btn.dataset.size, 10);
      console.log('Размер кисти:', brushSize);
    });
  });
}

function updateBrushActive() {
  document.querySelectorAll('.brush-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.size, 10) === brushSize);
  });
}

// ============================================================
// ИСТОРИЯ (для отмены) — БЕЗ getImageData
// ============================================================
function saveHistory() {
  // Создаём копию canvas через drawImage
  const snapshot = document.createElement('canvas');
  snapshot.width = canvas.width;
  snapshot.height = canvas.height;
  const sctx = snapshot.getContext('2d');
  sctx.drawImage(canvas, 0, 0);

  history.push(snapshot);
  if (history.length > MAX_HISTORY) history.shift();
  updateUndoButton();
}

function undo() {
  if (history.length === 0) return;

  const previous = history.pop();

  // Очищаем и рисуем снимок
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(previous, 0, 0);

  updateUndoButton();
  console.log('Отменено. Осталось шагов:', history.length);
}

function updateUndoButton() {
  const btn = document.getElementById('undoBtn');
  btn.disabled = history.length === 0;
}

// ============================================================
// ПЕРЕРИСОВКА ФОНА
// ============================================================
function redraw() {
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (outlineImg.complete && outlineImg.naturalWidth > 0) {
    const imgRatio = outlineImg.naturalWidth / outlineImg.naturalHeight;
    const canvasRatio = canvas.width / canvas.height;

    let w, h, x, y;
    if (imgRatio > canvasRatio) {
      w = canvas.width;
      h = canvas.width / imgRatio;
      x = 0;
      y = (canvas.height - h) / 2;
    } else {
      h = canvas.height;
      w = canvas.height * imgRatio;
      x = (canvas.width - w) / 2;
      y = 0;
    }
    ctx.drawImage(outlineImg, x, y, w, h);
  }
}

// ============================================================
// РИСОВАНИЕ
// ============================================================
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function drawDot(pos) {
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2);
  ctx.fillStyle = currentColor;
  ctx.fill();
}

function drawLine(from, to) {
  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.lineTo(to.x, to.y);
  ctx.strokeStyle = currentColor;
  ctx.lineWidth = brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

// ============================================================
// МЫШЬ
// ============================================================
canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  saveHistory();
  isDrawing = true;
  const pos = getPos(e);
  lastX = pos.x;
  lastY = pos.y;
  drawDot(pos);
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getPos(e);
  drawLine({ x: lastX, y: lastY }, pos);
  lastX = pos.x;
  lastY = pos.y;
});

canvas.addEventListener('mouseup', () => { isDrawing = false; });
canvas.addEventListener('mouseleave', () => { isDrawing = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ============================================================
// ТАЧ
// ============================================================
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  saveHistory();
  isDrawing = true;
  const pos = getPos(e);
  lastX = pos.x;
  lastY = pos.y;
  drawDot(pos);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getPos(e);
  drawLine({ x: lastX, y: lastY }, pos);
  lastX = pos.x;
  lastY = pos.y;
}, { passive: false });

canvas.addEventListener('touchend', () => { isDrawing = false; });

// ============================================================
// КНОПКИ
// ============================================================
document.getElementById('backBtn').addEventListener('click', showMenu);

document.getElementById('undoBtn').addEventListener('click', undo);

document.getElementById('clearBtn').addEventListener('click', () => {
  saveHistory();
  redraw();
  console.log('Очищено');
});

document.getElementById('saveBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'my-coloring.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// ============================================================
// ЗАПУСК
// ============================================================
buildMenu();
buildPalette();
initBrushSizes();
updateUndoButton();
console.log('Игра-раскраска готова');
</script>
</body>
</html>
